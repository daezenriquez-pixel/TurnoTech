<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TurnoTech · Reserva de Salas de Cómputo</title>
    <meta name="description" content="Plataforma para que los docentes reserven salas de cómputo del colegio." />

    <!-- Tipografías: Sora (títulos, con carácter técnico) + Inter (texto, muy legible) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <script>
      // Se aplica antes de montar React para evitar parpadeo claro/oscuro al cargar
      (function () {
        var saved = localStorage.getItem('turnotech-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved ? saved === 'dark' : prefersDark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
